# Builds cast-shadow.zip (just the two library files) and attaches it to a
# release. The demo page and README link to
#   https://github.com/jonSandruck/cast-shadow/releases/latest/download/cast-shadow.zip
# which always resolves to the newest release, so publishing a release is
# the only step. Run it by hand to rebuild the zip for an existing tag.
name: Release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip to
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build cast-shadow.zip
        run: zip -j cast-shadow.zip cast-shadow.js cast-shadow.css

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" cast-shadow.zip --clobber
